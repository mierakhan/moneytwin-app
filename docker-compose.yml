services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moneytwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: moneytwin
    ports:
      - "5432:5432"
    volumes:
      - moneytwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://moneytwin:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/moneytwin
      APP_SECRET_KEY: ${APP_SECRET_KEY:-generate-a-real-secret}
      FRONTEND_ORIGIN: http://localhost:5173
      AI_PROVIDER: ${AI_PROVIDER:-off}
      FLOWISE_URL: ${FLOWISE_URL:-}
      FLOWISE_FLOW_ID: ${FLOWISE_FLOW_ID:-}
      FLOWISE_API_KEY: ${FLOWISE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  moneytwin_pgdata:
